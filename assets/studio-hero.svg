<svg xmlns="http://www.w3.org/2000/svg" width="920" height="240" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
<title id="title">Uniplanck macOS product studio</title><desc id="desc">A subtle animated showcase of ApexTerm, Branchlight, and Board-Man.</desc>
<style>
:root { color-scheme: light dark; }
.surface { fill:#f6f8fa; stroke:#d0d7de; }
.grid { stroke:#d8dee4; opacity:.38; }
.eyebrow { fill:#57606a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:11px; font-weight:600; letter-spacing:1.8px; }
.headline { fill:#1f2328; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:23px; font-weight:650; }
.sub { fill:#656d76; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; font-weight:500; }
.card { opacity:.72; transform-box:fill-box; transform-origin:center; animation:focus 9s infinite ease-in-out; }
.card-bg { fill:#ffffff; stroke:#d0d7de; stroke-width:1; }
.monogram-box { fill:#ddf4ff; stroke:#54aeff; }
.monogram { fill:#0969da; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:11px; font-weight:700; letter-spacing:.4px; }
.product { fill:#1f2328; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:17px; font-weight:650; }
.role { fill:#656d76; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:10px; font-weight:600; letter-spacing:1px; }
.a { animation-delay:0s; }.b { animation-delay:3s; }.c { animation-delay:6s; }
.pulse { fill:#2da44e; transform-box:fill-box; transform-origin:center; animation:pulse 1.8s infinite ease-in-out; }
.progress-bg { fill:#d8dee4; }.progress { fill:#0969da; transform-origin:34px 223px; animation:progress 9s infinite linear; }
@keyframes focus { 0%,27% { opacity:1; transform:translateY(-3px); } 33%,100% { opacity:.58; transform:translateY(0); } }
@keyframes pulse { 0%,100% { opacity:.45; transform:scale(.82); } 50% { opacity:1; transform:scale(1); } }
@keyframes progress { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@media (prefers-color-scheme: dark) {
.surface { fill:#0d1117; stroke:#30363d; }.grid { stroke:#30363d; opacity:.50; }.eyebrow { fill:#8c959f; }
.headline,.product { fill:#f0f6fc; }.sub,.role { fill:#8c959f; }.card-bg { fill:#161b22; stroke:#30363d; }
.monogram-box { fill:#0c2d48; stroke:#1f6feb; }.monogram { fill:#58a6ff; }.progress-bg { fill:#21262d; }.progress { fill:#58a6ff; }.pulse { fill:#3fb950; }
}
@media (prefers-reduced-motion: reduce) { .card { animation:none; opacity:1; transform:none; }.pulse,.progress { animation:none; }.progress { transform:scaleX(1); } }
</style>
<rect class="surface" x="1" y="1" width="918" height="238" rx="24"/>
<path class="grid" d="M34 119H886 M306 119V210 M592 119V210" fill="none"/>
<text class="eyebrow" x="34" y="42">UNIPLANCK / MACOS PRODUCT STUDIO</text>
<text class="headline" x="34" y="76">Three focused tools. One native workflow.</text>
<text class="sub" x="34" y="101">Terminal workspace · Finder-native Git · Local-first productivity</text>
<circle class="pulse" cx="874" cy="40" r="4"/>
<g class="card a"><rect class="card-bg" x="34" y="132" width="252" height="78" rx="16"/><rect class="monogram-box" x="50" y="149" width="38" height="38" rx="10"/><text class="monogram" x="60" y="173">AT</text><text class="product" x="104" y="163">ApexTerm</text><text class="role" x="104" y="184">TERMINAL WORKSPACE</text></g>
<g class="card b"><rect class="card-bg" x="320" y="132" width="252" height="78" rx="16"/><rect class="monogram-box" x="336" y="149" width="38" height="38" rx="10"/><text class="monogram" x="346" y="173">BL</text><text class="product" x="390" y="163">Branchlight</text><text class="role" x="390" y="184">FINDER-NATIVE GIT</text></g>
<g class="card c"><rect class="card-bg" x="606" y="132" width="280" height="78" rx="16"/><rect class="monogram-box" x="622" y="149" width="38" height="38" rx="10"/><text class="monogram" x="631" y="173">BM</text><text class="product" x="676" y="163">Board-Man</text><text class="role" x="676" y="184">LOCAL-FIRST CLIPBOARD</text></g>
<rect class="progress-bg" x="34" y="221" width="852" height="2" rx="1"/><rect class="progress" x="34" y="221" width="852" height="2" rx="1"/>
</svg>