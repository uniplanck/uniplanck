<svg xmlns="http://www.w3.org/2000/svg" width="560" height="790" viewBox="0 0 560 790" role="img" aria-labelledby="title desc"><title id="title">Nao Yamao — Uniplanck Face Terminal mobile</title><desc id="desc">Mobile GitHub profile hero with Nao Yamao's portrait and Uniplanck terminal information.</desc><defs><clipPath id="frame"><rect x="1" y="1" width="558" height="788" rx="24"/></clipPath><clipPath id="portraitClip"><rect x="20" y="52" width="520" height="330" rx="18"/></clipPath><linearGradient id="fadeMaskGradient" x1="0" x2="1"><stop offset="0%" stop-color="white"/><stop offset="76%" stop-color="white"/><stop offset="92%" stop-color="#bdbdbd"/><stop offset="100%" stop-color="black"/></linearGradient><mask id="portraitFade"><rect x="20" y="52" width="520" height="330" fill="url(#fadeMaskGradient)"/></mask><linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="currentColor" stop-opacity="0"/><stop offset="50%" stop-color="currentColor" stop-opacity=".2"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/></linearGradient><linearGradient id="bottomFadeLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f6f8fa" stop-opacity="0"/><stop offset="72%" stop-color="#f6f8fa" stop-opacity=".32"/><stop offset="100%" stop-color="#f6f8fa" stop-opacity=".92"/></linearGradient><linearGradient id="bottomFadeDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1117" stop-opacity="0"/><stop offset="72%" stop-color="#0d1117" stop-opacity=".36"/><stop offset="100%" stop-color="#0d1117" stop-opacity=".94"/></linearGradient><linearGradient id="reflectionGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop offset="50%" stop-color="#8bd5ff" stop-opacity=".42"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/></linearGradient><linearGradient id="beamGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/><stop off