<g clip-path="url(#terminal)"><g class="reveal"><text class="prompt" x="46" y="391">nao@uniplanck:~$ whoami</text></g><g class="reveal r2"><text class="strong" x="46" y="422">Nao Yamao</text></g><g class="reveal r3"><text class="prompt" x="46" y="462">nao@uniplanck:~$ focus</text></g><g class="reveal r4"><text class="out" x="46" y="491">Native macOS developer tools</text><text class="sub" x="46" y="515">Local-first productivity software</text></g><g class="reveal r5"><text class="prompt" x="46" y="555">nao@uniplanck:~$ ls products</text></g><g class="reveal r6"><rect class="box" x="46" y="570" width="126" height="34" rx="10"/><text class="prod" x="63" y="592">ApexTerm</text><rect class="box" x="182" y="570" width="138" height="34" rx="10"/><text class="prod" x="200" y="592">Branchlight</text><rect class="box" x="330" y="570" width="126" height="34" rx="10"/><text class="prod" x="348" y="592">Board-Man</text></g><g class="reveal r7"><text class="prompt" x="46" y="640">nao@uniplanck:~$ cat now.txt</text></g><g class="reveal r8"><text class="sub" x="46" y="670">Shipping tools for developers</text><text class="sub" x="46" y="692">and power users.</text></g><g class="reveal r9"><rect class="cursor" x="46" y="706" width="8" height="16" rx="1"/></g></g>
