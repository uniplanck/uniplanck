<svg xmlns="http://www.w3.org/2000/svg" width="920" height="54" viewBox="0 0 920 54" role="img" aria-labelledby="title desc">
<title id="title">Uniplanck studio principles</title><desc id="desc">A subtle scrolling strip of Uniplanck product principles.</desc>
<defs><clipPath id="clip"><rect x="1" y="1" width="918" height="52" rx="16"/></clipPath></defs>
<style>
:root { color-scheme:light dark; }.surface { fill:#f6f8fa; stroke:#d0d7de; }
.ticker { fill:#57606a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:11px; font-weight:600; letter-spacing:1.3px; animation:ticker 18s linear infinite; }
.dot { fill:#0969da; animation:pulse 1.8s ease-in-out infinite; }
@keyframes ticker { from { transform:translateX(0); } to { transform:translateX(-920px); } }
@keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
@media (prefers-color-scheme:dark) { .surface { fill:#0d1117; stroke:#30363d; }.ticker { fill:#8c959f; }.dot { fill:#58a6ff; } }
@media (prefers-reduced-motion:reduce) { .ticker,.dot { animation:none; }.ticker { transform:translateX(0); }.dot { opacity:1; } }
</style>
<rect class="surface" x="1" y="1" width="918" height="52" rx="16"/>
<g clip-path="url(#clip)"><circle class="dot" cx="22" cy="27" r="3"/><g class="ticker">
<text x="42" y="31">NATIVE MACOS  ·  DEVELOPER TOOLS  ·  LOCAL-FIRST  ·  OPEN SOURCE  ·  SWIFT  ·  SHIP SMALL, SHIP REAL  ·</text>
<text x="962" y="31">NATIVE MACOS  ·  DEVELOPER TOOLS  ·  LOCAL-FIRST  ·  OPEN SOURCE  ·  SWIFT  ·  SHIP SMALL, SHIP REAL  ·</text>
</g></g></svg>