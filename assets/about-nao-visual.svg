<svg xmlns="http://www.w3.org/2000/svg" width="920" height="180" viewBox="0 0 920 180" role="img" aria-labelledby="title desc">
<title id="title">Building Uniplanck</title><desc id="desc">A restrained terminal visual derived from Nao Yamao's urban portrait.</desc>
<defs><clipPath id="scene"><rect x="18" y="18" width="316" height="144" rx="16"/></clipPath></defs>
<style>
:root{color-scheme:light dark}.surface{fill:#f6f8fa;stroke:#d0d7de}.pane{fill:#fff;stroke:#d8dee4}.ascii{fill:#57606a;opacity:.62;font:600 4.25px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.08px}.scan{fill:#0969da;opacity:.045;animation:scan 8s ease-in-out infinite}.kicker{fill:#0969da;font:700 10px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.4px}.head{fill:#1f2328;font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{fill:#57606a;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.rule{stroke:#d0d7de}.dot{fill:#1a7f37;animation:pulse 2.2s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-14px)}50%{transform:translateY(128px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-color-scheme:dark){.surface{fill:#0d1117;stroke:#30363d}.pane{fill:#0b0f14;stroke:#30363d}.ascii{fill:#8c959f;opacity:.72}.scan{fill:#58a6ff;opacity:.055}.kicker{fill:#58a6ff}.head{fill:#f0f6fc}.body{fill:#8c959f}.rule{stroke:#30363d}.dot{fill:#3fb950}}@media(prefers-reduced-motion:reduce){.scan,.dot{animation:none}.scan{display:none}.dot{opacity:1}}
</style>
<rect class="surface" x="1" y="1" width="918" height="178" rx="22"/><rect class="pane" x="18" y="18" width="316" height="144" rx="16"/>
