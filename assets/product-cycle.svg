<svg xmlns="http://www.w3.org/2000/svg" width="680" height="104" viewBox="0 0 680 104" role="img" aria-labelledby="title desc">
<title id="title">Building native macOS products</title><desc id="desc">A rotating product and role label cycling through ApexTerm, Branchlight, and Board-Man.</desc>
<style>
:root { color-scheme:light dark; }
.label { fill:#57606a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:11px; font-weight:600; letter-spacing:1.8px; }
.product { fill:#24292f; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:26px; font-weight:680; opacity:0; animation:cycle 9s infinite; }
.role { fill:#656d76; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; font-weight:500; opacity:0; animation:cycle 9s infinite; }
.apex { animation-delay:0s; }.branch { animation-delay:3s; }.board { animation-delay:6s; }
.product.apex,.role.apex { opacity:1; }
.cursor { fill:#0969da; animation:blink 1s steps(1) infinite; }.seg { fill:#d0d7de; }
.active { fill:#0969da; opacity:.16; animation:segment 9s infinite; }.s1 { animation-delay:0s; opacity:1; }.s2 { animation-delay:3s; }.s3 { animation-delay:6s; }
@keyframes cycle { 0%,27% { opacity:1; transform:translateY(0); } 30% { opacity:0; transform:translateY(-4px); } 33%,100% { opacity:0; transform:translateY(4px); } }
@keyframes segment { 0%,27% { opacity:1; } 33%,100% { opacity:.16; } }
@keyframes blink { 0%,48% { opacity:1; } 49%,100% { opacity:.2; } }
@media (prefers-color-scheme:dark) { .label,.role { fill:#8c959f; }.product { fill:#f0f6fc; }.cursor,.active { fill:#58a6ff; }.seg { fill:#30363d; } }
@media (prefers-reduced-motion:reduce) { .product,.role,.active,.cursor { animation:none; }.product,.role { opacity:0; transform:none; }.apex { opacity:1; }.active.s1 { opacity:1; }.active.s2,.active.s3 { opacity:.16; }.cursor { opacity:1; } }
</style>
<text class="label" x="2" y="18">BUILDING NOW</text><rect class="cursor" x="2" y="34" width="4" height="25" rx="2"/>
<text class="product apex" x="18" y="56">ApexTerm</text><text class="product branch" x="18" y="56">Branchlight</text><text class="product board" x="18" y="56">Board-Man</text>
<text class="role apex" x="18" y="78">Native terminal workspace for macOS</text><text class="role branch" x="18" y="78">Finder-native Git client for macOS</text><text class="role board" x="18" y="78">Local-first clipboard and text workflow</text>
<rect class="seg" x="18" y="92" width="72" height="3" rx="1.5"/><rect class="seg" x="98" y="92" width="72" height="3" rx="1.5"/><rect class="seg" x="178" y="92" width="72" height="3" rx="1.5"/>
<rect class="active s1" x="18" y="92" width="72" height="3" rx="1.5"/><rect class="active s2" x="98" y="92" width="72" height="3" rx="1.5"/><rect class="active s3" x="178" y="92" width="72" height="3" rx="1.5"/>
</svg>