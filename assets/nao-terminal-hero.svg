  <linearGradient id="scanGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="currentColor" stop-opacity="0"/><stop offset="25%" stop-color="currentColor" stop-opacity=".08"/><stop offset="50%" stop-color="currentColor" stop-opacity=".22"/><stop offset="75%" stop-color="currentColor" stop-opacity=".08"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/></linearGradient>
