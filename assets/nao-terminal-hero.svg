<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
<title id="title">Nao Yamao — Uniplanck Face Terminal</title>
<desc id="desc">A refined terminal-style GitHub profile hero with Nao Yamao's portrait and Uniplanck's native macOS products.</desc>
<defs>
  <clipPath id="frame"><rect x="1" y="1" width="918" height="478" rx="24"/></clipPath>
