<style>
:root{color-scheme:light dark}.surface{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}.topbar{fill:#ffffff;opacity:.90}.rule{stroke:#d8dee4;stroke-width:1}.grid{stroke:#d8dee4;opacity:.28}.title{fill:#57606a;font:600 11px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.7px}.meta{fill:#8c959f;font:600 9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:1.1px}.prompt{fill:#0969da;font:600 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.output{fill:#1f2328;font:600 15px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.name{fill:#1f2328;font:700 20px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.soft{fill:#57606a;font:500 13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.product{fill:#1f2328;font:650 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.portrait{filter:url(#portraitGlow)}.edge{fill:#0969da;opacity:.48;font:600 6.2px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.1px;animation:drift 9s ease-in-out infinite}.scan{color:#0969da;fill:url(#scanGradient);opacity:.55;animation:scan 7.5s ease-in-out infinite}.cursor{fill:#0969da;animation:blink 1.05s steps(1,end) infinite}.dot-r{fill:#ff5f57}.dot-y{fill:#febc2e}.dot-g{fill:#28c840}@keyframes scan{0%,100%{transform:translateY(-22px);opacity:.16}50%{transform:translateY(362px);opacity:.58}}@keyframes drift{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(8px);opacity:.62}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.12}}@media(prefers-color-scheme:dark){.surface{fill:#0d1117;stroke:#30363d}.topbar{fill:#0b0f14;opacity:.96}.rule{stroke:#30363d}.grid{stroke:#21262d;opacity:.82}.title{fill:#8c959f}.meta,.soft{fill:#8c959f}.prompt,.cursor{fill:#58a6ff}.output,.name,.product{fill:#f0f6fc}.edge{fill:#58a6ff}.scan{color:#58a6ff}}@media(prefers-reduced-motion:reduce){.edge,.scan,.cursor{animation:none!important}.edge{opacity:.46;transform:none